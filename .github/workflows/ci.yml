name: Company OS CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # All gates are stdlib-only; the runner's system Python (3.12) is sufficient.
      - name: Run all deterministic CI gates
        run: python3 scripts/ci.py
