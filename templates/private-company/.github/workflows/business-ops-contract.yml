name: Business OS contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iotyndall/agentic-business-operations
          ref: FRAMEWORK_SHA_REPLACE_ME
          path: .company-os
          persist-credentials: false
      - name: Bind validator checkout to private framework lock
        run: python .company-os/scripts/validate_framework_lock.py .agentic/business-ops.lock.json .company-os
      - name: Validate private company contract
        run: python .company-os/scripts/validate_company_contract.py .agentic/business-ops.json
      - name: Prove malformed company contracts fail
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='.agentic/business-ops.json'; d=json.load(open(p)); d['data'].setdefault('allowed_context_refs',[]).append('system://__undeclared_selftest__'); json.dump(d,open('/tmp/bad-business-ops.json','w'))
          PY
          if python .company-os/scripts/validate_company_contract.py /tmp/bad-business-ops.json; then
            echo '::error::Business OS validator accepted an unresolved system context reference.'
            exit 1
          fi
