name: Business OS contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read immutable Company OS framework lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentic/business-ops.lock.json
          COMMIT="$(jq -r '.commit' .agentic/business-ops.lock.json)"
          REPO="$(jq -r '.repository' .agentic/business-ops.lock.json)"
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$REPO" = 'iotyndall/agentic-business-operations'
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iotyndall/agentic-business-operations
          ref: ${{ steps.lock.outputs.commit }}
          path: .company-os
          persist-credentials: false

      # All framework gates are stdlib-only; the runner's system Python is sufficient.
      - name: Bind checkout to lock
        run: python3 .company-os/scripts/validate_framework_lock.py .agentic/business-ops.lock.json .company-os

      - name: Apply exact locked contract schema
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="$(jq -r '.contract_schema' .agentic/business-ops.lock.json)"
          python3 .company-os/scripts/validate_json_schema.py ".company-os/$SCHEMA" .agentic/business-ops.json

      - name: Validate semantic Company OS invariants
        run: python3 .company-os/scripts/validate_company_contract.py .agentic/business-ops.json

      - name: Prove unresolved system references fail closed
        run: python3 .company-os/scripts/contract_selftest.py .agentic/business-ops.json
